workflowVersion: 1.0.0
speakeasyVersion: latest
sources:
    SankaPublicAPI:
        inputs:
            - location: openapi/openapi.json
        overlays:
            - location: .speakeasy/operation-ids.overlay.yaml
        output: .speakeasy/out.openapi.yaml
        registry:
            location: registry.speakeasyapi.dev/sanka/sanka/sanka-public-api
targets:
    sanka-sdk:
        target: typescript
        source: SankaPublicAPI
        codeSamples:
            registry:
                location: registry.speakeasyapi.dev/sanka/sanka/sanka-public-api-typescript-code-samples
            labelOverride:
                fixedValue: Typescript (SDK)
            blocking: false
